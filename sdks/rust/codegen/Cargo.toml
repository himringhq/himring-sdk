[package]
name = "himring-codegen"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Writes the generated code of the himring crate from the OpenAPI documents in spec/."

[workspace]

[dependencies]
serde_json = { version = "1.0.145", features = ["preserve_order"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
