[project]
name = "himring"
version = "0.1.0"
description = "The Python SDK of the Himring API, which lets AI agents answer from what a business knows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["himring", "sdk", "retrieval", "rag", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://himring.ai"
Repository = "https://github.com/himringhq/himring-sdk"
Issues = "https://github.com/himringhq/himring-sdk/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/himring"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "codegen"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S310", "S603", "S607"]
"codegen/generate.py" = ["S603"]
"src/himring/_generated/*.py" = ["E501"]
"src/himring/types.py" = ["F403"]

[tool.pyright]
include = ["src", "tests", "codegen"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
