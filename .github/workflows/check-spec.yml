name: Check the spec

on:
  workflow_call:
    inputs:
      projects:
        description: The JSON array of affected projects that this workflow checks
        required: true
        type: string

permissions:
  contents: read

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  check:
    name: Check that spec/ matches the pinned @himring/openapi release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout the full history with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate, lint, and typecheck the spec project
        env:
          AFFECTED_PROJECTS: ${{ inputs.projects }}
        run: pnpm exec nx run-many -t validate lint typecheck --projects="$(jq --raw-output 'join(",")' <<< "$AFFECTED_PROJECTS")" --outputStyle=static
