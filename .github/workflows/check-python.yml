name: Check the Python projects

on:
  workflow_call:
    inputs:
      projects:
        description: The JSON array of affected projects that this workflow checks
        required: true
        type: string

permissions:
  contents: read

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  check:
    name: Check the affected Python projects
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout the full history with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup uv with astral-sh/setup-uv v10.2.0
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.12.21
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the generated Python SDK matches the spec
        env:
          AFFECTED_PROJECTS: ${{ inputs.projects }}
        run: pnpm exec nx run-many -t generate:check --projects="$(jq --raw-output 'join(",")' <<< "$AFFECTED_PROJECTS")" --outputStyle=static

      - name: Lint, typecheck, build, and test the affected Python projects
        env:
          AFFECTED_PROJECTS: ${{ inputs.projects }}
        run: pnpm exec nx run-many -t lint typecheck build test --projects="$(jq --raw-output 'join(",")' <<< "$AFFECTED_PROJECTS")" --outputStyle=static

  oldest-python:
    name: Test the Python packages on the oldest Python that each supports
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout the full history with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup uv with astral-sh/setup-uv v10.2.0
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.12.21
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Python SDK on Python 3.10
        if: ${{ contains(fromJSON(inputs.projects), 'sdk-python') }}
        env:
          UV_PYTHON: '3.10'
        run: pnpm exec nx run sdk-python:test --skip-nx-cache --outputStyle=static

      - name: Test the agent hooks on Python 3.11
        if: ${{ contains(fromJSON(inputs.projects), 'agent-hooks-python') }}
        env:
          UV_PYTHON: '3.11'
        run: pnpm exec nx run agent-hooks-python:test --skip-nx-cache --outputStyle=static
