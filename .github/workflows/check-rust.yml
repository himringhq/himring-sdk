name: Check the Rust projects

on:
  workflow_call:
    inputs:
      projects:
        description: The JSON array of affected projects that this workflow checks
        required: true
        type: string

permissions:
  contents: read

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false
  CARGO_TERM_COLOR: never
  OLDEST_SUPPORTED_RUST: '1.88'

jobs:
  check:
    name: Check the affected Rust projects
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout the full history with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the Rust toolchain that rust-toolchain.toml pins
        working-directory: sdks/rust
        run: rustup toolchain install

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the generated Rust SDK matches the spec
        env:
          AFFECTED_PROJECTS: ${{ inputs.projects }}
        run: pnpm exec nx run-many -t generate:check --projects="$(jq --raw-output 'join(",")' <<< "$AFFECTED_PROJECTS")" --outputStyle=static

      - name: Lint, typecheck, build, and test the affected Rust projects
        env:
          AFFECTED_PROJECTS: ${{ inputs.projects }}
        run: pnpm exec nx run-many -t lint typecheck build test --projects="$(jq --raw-output 'join(",")' <<< "$AFFECTED_PROJECTS")" --outputStyle=static

  oldest-rust:
    name: Test the Rust crate on the oldest Rust that it supports
    if: ${{ contains(fromJSON(inputs.projects), 'sdk-rust') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout the full history with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm with pnpm/action-setup v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the oldest Rust that the crate declares in rust-version
        run: rustup toolchain install "$OLDEST_SUPPORTED_RUST" --profile minimal

      - name: Check that rust-version in Cargo.toml matches the oldest Rust that this job tests
        working-directory: sdks/rust
        run: |
          declared="$(cargo metadata --no-deps --format-version 1 | jq --raw-output '.packages[] | select(.name == "himring") | .rust_version')"
          if [[ "$declared" != "$OLDEST_SUPPORTED_RUST" ]]; then
            echo "::error::Cargo.toml declares rust-version $declared, and this job tests Rust $OLDEST_SUPPORTED_RUST."
            exit 1
          fi

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the contract server that the tests call
        run: pnpm exec nx run contract-server:build --outputStyle=static

      - name: Test the Rust SDK on the oldest supported Rust
        working-directory: sdks/rust
        run: cargo "+$OLDEST_SUPPORTED_RUST" test --locked
