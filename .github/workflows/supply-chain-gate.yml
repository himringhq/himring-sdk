name: Supply-chain gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supply-chain-gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-supply-chain:
    name: Check action pins, publish permissions, dependency sources, and release-age cooldowns
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Run the supply-chain gate
        run: node .github/scripts/check-supply-chain.ts
